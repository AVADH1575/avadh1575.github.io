<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,Arial,sans-serif;background:radial-gradient(900px 500px at 85% 20%,#12305e 0%,#0A111E 60%);color:#E7ECF4;display:flex}
  .l{padding:70px 0 0 72px;width:640px}
  .pill{display:inline-flex;gap:8px;align-items:center;font-size:20px;color:#9AA6B9;border:1px solid #1E2B42;border-radius:999px;padding:8px 16px;background:#101A2B}
  .dot{width:10px;height:10px;border-radius:50%;background:#3CCB8A}
  h1{font-size:64px;line-height:1.05;margin:26px 0 10px;letter-spacing:-.02em;font-weight:800}
  h2{font-size:34px;margin:0 0 26px;font-weight:600;background:linear-gradient(92deg,#4DA3FF,#3CCBFF);-webkit-background-clip:text;color:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:10px;max-width:560px}
  .chips span{font-size:20px;padding:7px 14px;border-radius:10px;background:#15223A;border:1px solid #1E2B42}
  .url{position:absolute;left:72px;bottom:46px;font-size:22px;color:#9AA6B9}
  .r{position:relative;flex:1}
  .ph{position:absolute;width:190px;border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.55);border:3px solid #22324d;background:#000}
  .ph img{display:block;width:100%}
  .a{left:-10px;top:120px;transform:rotate(-6deg)}
  .b{left:150px;top:60px;z-index:2}
  .c{left:310px;top:120px;transform:rotate(6deg)}
</style></head>
<body>
  <div class="l">
    <span class="pill"><span class="dot"></span>Looking for a new Flutter role · Ahmedabad or remote</span>
    <h1>Avadh Darania</h1>
    <h2>Senior Flutter Developer · 4+ years</h2>
    <div class="chips"><span>Flutter</span><span>Dart</span><span>BLoC</span><span>Firebase</span><span>ARKit RoomPlan</span><span>UWB / BLE</span><span>Stripe</span><span>App Store &amp; Play</span></div>
  </div>
  <div class="url">avadh1575.github.io</div>
  <div class="r">
    <div class="ph a"><img src="../../media/dreamclouds/highlight-ios.poster.webp"></div>
    <div class="ph b"><img src="../../media/floor-plan-ar/highlight.poster.webp"></div>
    <div class="ph c"><img src="../../media/piggy/highlight.poster.webp"></div>
  </div>
</body></html>
